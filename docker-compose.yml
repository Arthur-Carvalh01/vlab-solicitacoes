version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vlab_db
    environment:
      POSTGRES_DB: vlab
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - vlab_db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: vlab_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  vlab_db_data: